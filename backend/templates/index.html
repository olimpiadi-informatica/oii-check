<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round2 - Olimpiadi di Informatica a Squadre</title>
    <link rel="icon" href="/cms/static/favicon.ico" />
    <script src="assets/autoload.js"></script>
    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
        }
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
        }
    </style>
    <script>
        addEventListener("DOMContentLoaded", function() {
            const content = document.getElementById("content");
            const debutant = location.pathname.includes("esordienti");
            content.src = debutant ? "/cms/round2-debutant" : "/cms/round2";
        });
    </script>
</head>
<body>
    <iframe id="content"></iframe>
</body>
</html>
